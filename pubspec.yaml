name: class_reminder
description: 课程表 + 作业/自习/工作提醒 + 笔记复盘，本地优先、离线可用。
publish_to: 'none'
version: 1.13.2+26
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  home_widget: 0.6.0
  file_picker: ^13.3.0
  open_filex: ^5.0.0
  url_launcher: ^6.3.1
  spreadsheet_decoder: ^2.3.0
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/timetable_seed.json
