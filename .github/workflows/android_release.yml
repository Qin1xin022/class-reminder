name: 打包安卓 APK 并发布

# 推送 v* 标签，或手动在网页上点「Run workflow」时触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r')
          C=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d+ -f2 | tr -d '\r')
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V (build $C)"

      # 关键一步：必须用和本机完全相同的签名证书，
      # 否则朋友手机上装的新版无法覆盖旧版（只能卸载重装，数据丢失）
      - name: 还原固定签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "✅ 已还原固定签名证书"
          else
            echo "::warning::仓库没有配置 KEYSTORE_BASE64 密钥，本次会用临时签名，朋友装不上！"
          fi

      - name: 拉取依赖
        run: flutter pub get

      - name: 编译 release APK
        run: flutter build apk --release

      - name: 整理安装包
        run: |
          V="${{ steps.ver.outputs.ver }}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          # kebiao-latest.apk 是固定文件名 —— 永久下载链接就靠它
          cp "$APK" kebiao-latest.apk
          cp "$APK" "kebiao-v$V.apk"
          sha256sum kebiao-latest.apk > kebiao-latest.apk.sha256
          ls -lh kebiao-*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 课表待办 v${{ steps.ver.outputs.ver }}
          make_latest: true
          body: |
            课表待办 v${{ steps.ver.outputs.ver }}（build ${{ steps.ver.outputs.code }}）

            **安卓手机直接点这里下载：**
            `kebiao-latest.apk`

            安装方法：下载 → 点开 → 允许"未知来源"一次 → 覆盖安装。
            课表、待办、笔记都不会丢（前提是签名与旧版一致）。

            数据只存在手机本地，不上传任何服务器。
          files: |
            kebiao-latest.apk
            kebiao-v${{ steps.ver.outputs.ver }}.apk
            kebiao-latest.apk.sha256
