name: 打包安卓 APK 并发布

# 推送 v* 标签，或手动在网页上点「Run workflow」时触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r')
          C=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//' | cut -d+ -f2 | tr -d '\r')
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V (build $C)"

      # 关键一步：必须用和本机完全相同的证书，否则朋友手机上装不上新版。
      # 证书写在仓库工作区里，由 build.gradle.kts 通过 CI_KEYSTORE 读取，
      # 不依赖 ~/.android（GitHub 运行器上的 user.home 不一定可靠）。
      - name: 还原固定签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ci
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > ci/debug.keystore
            echo "证书大小：$(stat -c%s ci/debug.keystore) 字节"
            keytool -list -v -keystore ci/debug.keystore -storepass android -alias androiddebugkey \
              | grep -E "SHA1|SHA-1" || true
            echo "✅ 已还原固定签名证书"
          else
            echo "::warning::仓库没有配置 KEYSTORE_BASE64 密钥，本次会用临时签名，朋友装不上！"
          fi

      - name: 拉取依赖
        run: flutter pub get

      - name: 编译 release APK
        env:
          CI_KEYSTORE: ${{ github.workspace }}/ci/debug.keystore
        run: flutter build apk --release

      - name: 校验签名指纹
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-1 digest" || true
          echo "本机应为：56:1F:80:E1:E6:33:12:A1:50:B4:D7:31:FF:26:81:B9:F0:2D:6D:8D"

      - name: 整理安装包
        run: |
          V="${{ steps.ver.outputs.ver }}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          # kebiao-latest.apk 是固定文件名 —— 永久下载链接就靠它
          cp "$APK" kebiao-latest.apk
          cp "$APK" "kebiao-v$V.apk"
          sha256sum kebiao-latest.apk > kebiao-latest.apk.sha256
          ls -lh kebiao-*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 课表待办 v${{ steps.ver.outputs.ver }}
          make_latest: true
          body: |
            课表待办 v${{ steps.ver.outputs.ver }}（build ${{ steps.ver.outputs.code }}）

            **下载地址（固定不变的链接）：**
            https://github.com/${{ github.repository }}/releases/latest/download/kebiao-latest.apk

            安装方法：下载 → 点开 → 允许"未知来源"一次 → 覆盖安装。
            课表、待办、笔记都不会丢（签名与旧版一致）。

            数据只存在手机本地，不上传任何服务器。
          files: |
            kebiao-latest.apk
            kebiao-v${{ steps.ver.outputs.ver }}.apk
            kebiao-latest.apk.sha256
